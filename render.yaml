services:
  - type: web
    name: content-gateway
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    disk:
      name: content-gateway-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
